[package]
name = "euchre-eval"
version = "0.1.0"
edition = "2024"
# Two binaries ship here; keep `cargo run -p euchre-eval` pointing at the
# head-to-head tool, and reach the tournament via `--bin euchre-tournament`.
default-run = "euchre-eval"

[dependencies]
euchre-interface = { path = "../euchre-interface" }
euchre-engine = { path = "../euchre-engine" }
euchre-agents = { path = "../euchre-agents" }
clap = { version = "4.6.1", features = ["derive"] }

[[bin]]
name = "euchre-eval"
path = "src/main.rs"

[[bin]]
name = "euchre-tournament"
path = "src/bin/tournament.rs"
