[package]
name = "euchre-server"
version = "0.1.0"
edition = "2024"

[dependencies]
euchre-interface = { path = "../euchre-interface", features = ["serde"] }
euchre-engine = { path = "../euchre-engine", features = ["serde"] }
euchre-agents = { path = "../euchre-agents" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.10.1", features = ["chacha"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"

[dev-dependencies]
tokio-tungstenite = "0.24"

[[example]]
name = "cli_client"
